<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills Section</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="skills-section" id="skills">

        <div class="container">

            <div class="section-title">
                <span>My Skills</span>
                <h1>Technical Skills</h1>
                <p>
                    Here are some of my technical skills and
                    proficiency levels.
                </p>
            </div>

            <div class="skills-container">

                <!-- HTML -->
                <div class="skill">
                    <div class="skill-info">
                        <h3>HTML</h3>
                        <span>95%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress html"></div>
                    </div>
                </div>


                <!-- CSS -->
                <div class="skill">
                    <div class="skill-info">
                        <h3>CSS</h3>
                        <span>90%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress css"></div>
                    </div>
                </div>


                <!-- JavaScript -->
                <div class="skill">
                    <div class="skill-info">
                        <h3>JavaScript</h3>
                        <span>80%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress javascript"></div>
                    </div>
                </div>


                <!-- React -->
                <div class="skill">
                    <div class="skill-info">
                        <h3>React</h3>
                        <span>75%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress react"></div>
                    </div>
                </div>


                <!-- Tailwind Css -->
                <div class="skill">
                    <div class="skill-info">
                        <h3>Tailwind CSS</h3>
                        <span>85%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress bootstrap"></div>
                    </div>
                </div>


                <!-- Git & GitHub -->
                <div class="skill">
                    <div class="skill-info">
                        <h3>Git & GitHub</h3>
                        <span>70%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress git"></div>
                    </div>
                </div>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
